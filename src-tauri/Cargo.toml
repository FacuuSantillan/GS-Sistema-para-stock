[package]
name = "GSSistemaparastock"
version = "0.1.0"
description = "Sistema para Stock"
authors = ["you"]
edition = "2021"

[lib]
name = "sistemastock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
